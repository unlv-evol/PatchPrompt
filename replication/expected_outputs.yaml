artifacts:
- name: canonical final analysis dataset
  path: dataset/processed/final_analysis_dataset.csv
  validation: csv_schema
  required_columns:
  - Case ID
  - PR_Link
  - Conversation_Link
  - Outcome_Class
  - Context
  - Specificity
  - Verification
  - Rationale
  - 'PQS '
  - PR_Size
  - Log_PR_Size
  - Has_Code
  - Adopt_Any
  - Fraction_Adopted
  - Status
  - Exp_Author_Repo
  - Time_To_Event
  - PR_Language
  smoke: true
- name: derived gate model dataset
  path: dataset/processed/gate_model_dataset.csv
